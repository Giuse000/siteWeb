<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scegli il tuo stile</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #11110f;
    }
    .choice-box {
      width: 100%;
      max-width: 420px;
      padding: 40px 30px;
      text-align: center;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    .choice-box h1 {
      margin-bottom: 10px;
      font-size: 28px;
      color: #222;
    }
    .choice-box p {
      margin-bottom: 30px;
      font-size: 15px;
      color: #777;
    }
    .choices {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .choice {
      display: block;
      padding: 16px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      transition: 0.2s ease;
    }
    .elegante {
      color: #fff;
      background: #11110f;
    }
    .normale {
      color: #222;
      background: #eee;
      border: 1px solid #ddd;
    }
    .choice:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="choice-box">
    <h1>Scegli il tuo stile</h1>
    <p>Seleziona la versione del menu che vuoi visualizzare.</p>
    <div class="choices">
      <a href="responsive/Elegant/desktop.html" class="choice elegante"> Versione Elegante </a>
      <a href="responsive/Normal/desktop.html" class="choice normale"> Versione Normale </a>
    </div>
  </div>
</body>
</html>
